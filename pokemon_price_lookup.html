const $=i=>document.getElementById(i);
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const rm=n=>'RM'+Math.round(n).toLocaleString();
const ago=h=>h<1?Math.round(h*60)+'m':h<24?Math.round(h)+'h':Math.round(h/24)+'d';

function render(){
  const q=$('q').value.toLowerCase().trim();
  const maxAge=+$('age').value, sort=$('sort').value;
  let r=D.filter(x=>x[3]<=maxAge);
  if(q) r=r.filter(x=>(x[0]+' '+x[2]).toLowerCase().includes(q));

  const prices=r.map(x=>x[1]), m=med(prices);
  const fresh=r.filter(x=>x[3]<=24).length;
  $('stats').innerHTML=
    '<div class="stat"><b>'+r.length+'</b><span>listings</span></div>'+
    '<div class="stat"><b>'+(m?rm(m):'&mdash;')+'</b><span>median</span></div>'+
    '<div class="stat"><b>'+(prices.length?rm(Math.min(...prices)):'&mdash;')+'</b><span>lowest</span></div>'+
    '<div class="stat"><b>'+(prices.length?rm(Math.max(...prices)):'&mdash;')+'</b><span>highest</span></div>'+
    '<div class="stat"><b>'+fresh+'</b><span>last 24h</span></div>';

  if(sort==='new') r.sort((a,b)=>a[3]-b[3]);
  else if(sort==='lo') r.sort((a,b)=>a[1]-b[1]);
  else if(sort==='hi') r.sort((a,b)=>b[1]-a[1]);
  else r.sort((a,b)=>a[1]/m-b[1]/m);

  $('empty').style.display=r.length?'none':'block';
  $('rows').innerHTML=r.slice(0,300).map(x=>{
    const disc=m&&x[1]<m*0.5&&r.length>=4;
    return '<tr><td class="r px">'+rm(x[1])+(disc?'<br><span class="dealtag">'+Math.round(100-x[1]/m*100)+'% under</span>':'')+
    '</td><td><a href="https://www.carousell.com.my/p/'+x[5]+'/" target="_blank" rel="noopener">'+
    x[0].replace(/</g,'&lt;')+'</a></td>'+
    '<td class="hidem sel">'+x[2].replace(/</g,'&lt;')+'</td>'+
    '<td class="r'+(x[3]<=24?' new':'')+'">'+ago(x[3])+'</td>'+
    '<td class="r hidem sel">'+x[4]+'</td></tr>';
  }).join('');
}
$('q').oninput=render; $('sort').onchange=render; $('age').onchange=render;
document.querySelectorAll('.tag').forEach(t=>t.onclick=()=>{$('q').value=t.dataset.q;render()});
render();
</script></body></html>
